[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogmr"
version = "0.1.0"
description = "Offline gap-fade research and guarded FYERS execution"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gapfade = "gapfade.__main__:main"

[tool.setuptools.packages.find]
include = ["gapfade*"]
